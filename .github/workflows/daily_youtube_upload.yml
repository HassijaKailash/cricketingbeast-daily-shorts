name: Daily Cricket Short Upload (@CricketingBeastHK)
on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      privacy_status:
        description: 'YouTube video privacy status'
        required: false
        default: 'public'
permissions:
  contents: write
jobs:
  generate-and-upload-short:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: pip install google-genai edge-tts Pillow google-api-python-client google-auth-oauthlib google-auth-httplib2
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY: ${{ inputs.privacy_status || 'public' }}
        run: python daily_cricket_shorts_pipeline.py
      - run: |
          if [ -f published_history.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add published_history.json
            git diff --staged --quiet || git commit -m "chore: log daily Short [skip ci]"
            git push
          fi:
    inputs:#!/usr/bin/env python3
"""
Automated Daily Cricket Shorts Generator & YouTube Uploader
Target Channel: CricketingBeast (@CricketingBeastHK)
Channel URL: http://www.youtube.com/channel/UC3BoUXkTT_jGwjT9t5O-Xog

Stack (100% Free Tier):
- Script & Metadata Generation: Google AI Studio (Gemini API via `google-genai`)
  Docs: https://aistudio.google.com/docs/get-started
- Voiceover Synthesis: Microsoft Edge TTS (`edge-tts`, voice: en-IN-PrabhatNeural)
- Visual Card & Video Assembly: Pillow (PIL) + FFmpeg (1080x1920 9:16 vertical MP4)
- Automated Upload: YouTube Data API v3 (`videos.insert` resumable upload)
  Docs: https://developers.google.com/youtube/data/guides/uploading_a_video
"""

import argparse
import asyncio
import datetime
import json
import os
import subprocess
import sys
import textwrap
from pathlib import Path
from typing import Any, Dict, List

from PIL import Image, ImageDraw, ImageFont

# Constants for @CricketingBeastHK
