# ---------------------------------------------------------------------------
# 2. Voiceover Audio Synthesis (edge-tts with offline fallback)
# ---------------------------------------------------------------------------

async def _synthesize_edge_tts(text: str, out_mp3: Path, voice: str) -> None:
    import edge_tts

    communicate = edge_tts.Communicate(text=text, voice=voice, rate="+8%")
    await communicate.save(str(out_mp3))


def generate_beat_audio(text: str, out_path: Path, voice: str = DEFAULT_VOICE) -> float:
    """
    Generates an audio file for a single beat using Microsoft Edge TTS (`edge-tts`).
    Returns the exact duration in seconds via `ffprobe`.
    """
    try:
        asyncio.run(_synthesize_edge_tts(text, out_path, voice))
    except Exception as exc:
        print(f"[WARN] edge-tts unavailable ({exc}); generating silent timing track for dry-run.")
        word_count = max(len(text.split()), 10)
        est_duration = max(round(word_count / 2.6, 2), 4.0)
        subprocess.run(
            [
                "ffmpeg",
                "-y",
                "-f",
                "lavfi",
                "-i",
                "anullsrc=r=44100:cl=mono",
                "-t",
                str(est_duration),
                "-q:a",
                "9",
                "-acodec",
                "libmp3lame",
                str(out_path),
            ],
            check=True,
            stdout=subprocess.DEVNULL,
            stderr=subprocess.DEVNULL,
        )

    probe = subprocess.run(
        [
            "ffprobe",
            "-v",
            "error",
            "-show_entries",
            "format=duration",
            "-of",
            "default=noprint_wrappers=1:nokey=1",
            str(out_path),
        ],
        capture_output=True,
        text=True,
        check=True,
    )
    return max(float(probe.stdout.strip()), 3.5)


# ---------------------------------------------------------------------------
# 3. 9:16 Broadcast Cricket Scoreboard Slide Renderer (Pillow + FFmpeg)
# ---------------------------------------------------------------------------

def _load_font(size: int, bold: bool = True) -> ImageFont.FreeTypeFont:
    candidates = [
        "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
        if bold
        else "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf",
        "/usr/share/fonts/truetype/liberation/LiberationSans-Bold.ttf",
        "/usr/share/fonts/truetype/freefont/FreeSansBold.ttf",
    ]
    for path in candidates:
        if os.path.exists(path):
            return ImageFont.truetype(path, size=size)
    return ImageFont.load_default()


def _hex_to_rgb(hex_color: str) -> tuple:
    h = hex_color.lstrip("#")
    if len(h) != 6:
        return (255, 153, 51)
    return tuple(int(h[i : i + 2], 16) for i in (0, 2, 4))


def render_beat_card(
    beat: Dict[str, Any],
    total_beats: int,
    channel_handle: str,
    title: str,
    out_png: Path,
) -> None:
    """Renders a 1080x1920 vertical broadcast-style cricket stat card."""
    img = Image.new("RGB", (VIDEO_WIDTH, VIDEO_HEIGHT), (10, 15, 28))
    draw = ImageDraw.Draw(img)
    accent = _hex_to_rgb(beat.get("accent_hex", "#FF9933"))

    for y in range(VIDEO_HEIGHT):
        ratio = y / VIDEO_HEIGHT
        r = int(10 + 18 * (1 - ratio))
        g = int(16 + 26 * (1 - ratio))
        b = int(32 + 45 * (1 - ratio))
        draw.line([(0, y), (VIDEO_WIDTH, y)], fill=(r, g, b))

    draw.rectangle([0, 0, VIDEO_WIDTH, 18], fill=accent)
    draw.rounded_rectangle([60, 80, VIDEO_WIDTH - 60, 175], radius=24, fill=(20, 29, 52), outline=accent, width=3)

    font_badge = _load_font(34, bold=True)
    font_phase = _load_font(30, bold=True)
    font_stat = _load_font(86, bold=True)
    font_sub = _load_font(38, bold=True)
    font_narration = _load_font(46, bold=True)
    font_footer = _load_font(30, bold=False)

    draw.text((95, 108), f"CRICKETING BEAST  •  {channel_handle}", fill=(255, 255, 255), font=font_badge)

    beat_idx = int(beat.get("beat_number", 1))
    pill_w = (VIDEO_WIDTH - 120 - (total_beats - 1) * 16) // total_beats
    for i in range(total_beats):
        px = 60 + i * (pill_w + 16)
        fill_col = accent if (i + 1) <= beat_idx else (40, 52, 80)
        draw.rounded_rectangle([px, 210, px + pill_w, 228], radius=9, fill=fill_col)

    draw.rounded_rectangle(
        [60, 290, VIDEO_WIDTH - 60, 980],
        radius=36,
        fill=(16, 24, 44),
        outline=accent,
        width=5,
    )

    phase_label = str(beat.get("phase_label", f"BEAT {beat_idx}")).upper()
    draw.rounded_rectangle([100, 335, 520, 405], radius=16, fill=accent)
    draw.text((125, 352), phase_label, fill=(10, 15, 28), font=font_phase)

    headline = str(beat.get("headline_stat", "CRICKET RECORD")).upper()
    wrapped_headline = textwrap.wrap(headline, width=14)[:3]
    y_cursor = 455
    for line in wrapped_headline:
        draw.text((100, y_cursor), line, fill=(255, 255, 255), font=font_stat)
        y_cursor += 105

    sub_stat = str(beat.get("sub_stat", "")).upper()
    draw.line([(100, 815), (VIDEO_WIDTH - 100, 815)], fill=(55, 72, 110), width=3)
    wrapped_sub = textwrap.wrap(sub_stat, width=32)[:2]
    y_sub = 845
    for line in wrapped_sub:
        draw.text((100, y_sub), line, fill=accent, font=font_sub)
        y_sub += 50

    draw.rounded_rectangle(
        [60, 1040, VIDEO_WIDTH - 60, 1620],
        radius=32,
        fill=(22, 33, 58),
        outline=(70, 90, 135),
        width=3,
    )
    narration = str(beat.get("narration", ""))
    wrapped_narration = textwrap.wrap(narration, width=28)[:7]
    y_nar = 1095
    for line in wrapped_narration:
        draw.text((100, y_nar), line, fill=(245, 247, 252), font=font_narration)
        y_nar += 68

    draw.text(
        (60, 1700),
        "SUBSCRIBE FOR DAILY CRICKET SHORTS  •  COMMENT YOUR PICK BELOW",
        fill=(170, 185, 215),
        font=font_footer,
    )
    img.save(out_png, format="PNG")


def assemble_short_video(plan: Dict[str, Any], output_mp4: Path) -> Path:
    """Renders each beat's visual card + voiceover and stitches them into a 9:16 MP4."""
    OUTPUT_DIR.mkdir(parents=True, exist_ok=True)
    beats = plan.get("beats", [])
    segment_files: List[Path] = []

    for idx, beat in enumerate(beats, start=1):
        img_path = OUTPUT_DIR / f"beat_{idx}.png"
        audio_path = OUTPUT_DIR / f"beat_{idx}.mp3"
        seg_path = OUTPUT_DIR / f"segment_{idx}.mp4"

        render_beat_card(
            beat=beat,
            total_beats=len(beats),
            channel_handle=CHANNEL_HANDLE,
            title=plan.get("title", ""),
            out_png=img_path,
        )
        duration = generate_beat_audio(beat.get("narration", ""), audio_path)

        subprocess.run(
            [
                "ffmpeg",
                "-y",
                "-loop",
                "1",
                "-i",
                str(img_path),
                "-i",
                str(audio_path),
                "-c:v",
                "libx264",
                "-tune",
                "stillimage",
                "-r",
                str(FPS),
                "-pix_fmt",
                "yuv420p",
                "-c:a",
                "aac",
                "-b:a",
                "192k",
                "-shortest",
                "-t",
                f"{duration:.2f}",
                str(seg_path),
            ],
            check=True,
            stdout=subprocess.DEVNULL,
            stderr=subprocess.DEVNULL,
        )
        segment_files.append(seg_path)

    concat_list = OUTPUT_DIR / "concat_list.txt"
    concat_list.write_text(
        "\n".join(f"file '{seg.resolve()}'" for seg in segment_files),
        encoding="utf-8",
    )

    subprocess.run(
        [
            "ffmpeg",
            "-y",
            "-f",
            "concat",
            "-safe",
            "0",
            "-i",
            str(concat_list),
            "-c:v",
            "libx264",
            "-pix_fmt",
            "yuv420p",
            "-c:a",
            "aac",
            "-b:a",
            "192k",
            "-movflags",
            "+faststart",
            str(output_mp4),
        ],
        check=True,
        stdout=subprocess.DEVNULL,
        stderr=subprocess.DEVNULL,
    )
    return output_mp4


# ---------------------------------------------------------------------------
# 4. YouTube Data API v3 Resumable Upload & One-Time OAuth Helper
# ---------------------------------------------------------------------------

def upload_to_youtube(video_path: Path, plan: Dict[str, Any], privacy_status: str = "public") -> str:
    """
    Authenticates via OAuth 2.0 Refresh Token and uploads the MP4 using
    YouTube Data API v3 `videos.insert` resumable media upload.
    Official docs: https://developers.google.com/youtube/data/guides/uploading_a_video
    """
    from google.oauth2.credentials import Credentials
    from googleapiclient.discovery import build
    from googleapiclient.http import MediaFileUpload

    client_id = os.environ["YOUTUBE_CLIENT_ID"]
    client_secret = os.environ["YOUTUBE_CLIENT_SECRET"]
    refresh_token = os.environ["YOUTUBE_REFRESH_TOKEN"]

    creds = Credentials(
        token=None,
        refresh_token=refresh_token,
        token_uri="https://oauth2.googleapis.com/token",
        client_id=client_id,
        client_secret=client_secret,
        scopes=["https://www.googleapis.com/auth/youtube.upload"],
    )

    youtube = build("youtube", "v3", credentials=creds)

    title = plan.get("title", "Unbelievable Cricket Record! #Shorts #Cricket")[:100]
    if "#Shorts" not in title and "#shorts" not in title:
        title = f"{title[:91]} #Shorts"

    body = {
        "snippet": {
            "title": title,
            "description": plan.get("description", ""),
            "tags": plan.get("tags", ["cricket", "shorts", "cricketingbeast"]),
            "categoryId": str(plan.get("category_id", "17")),
            "defaultLanguage": "en",
            "defaultAudioLanguage": "en-IN",
        },
        "status": {
            "privacyStatus": privacy_status,
            "selfDeclaredMadeForKids": False,
        },
    }

    media = MediaFileUpload(
        str(video_path),
        mimetype="video/mp4",
        chunksize=1024 * 1024 * 5,
        resumable=True,
    )

    request = youtube.videos().insert(
        part="snippet,status",
        body=body,
        media_body=media,
    )

    response = None
    while response is None:
        status, response = request.next_chunk()
        if status:
            print(f"[UPLOAD] Progress: {int(status.progress() * 100)}%")

    video_id = response["id"]
    print(f"[SUCCESS] Uploaded Short to {CHANNEL_HANDLE}: https://www.youtube.com/shorts/{video_id}")
    return video_id


def run_oauth_refresh_token_helper(client_secrets_file: str) -> None:
    """One-time local helper to generate YOUTUBE_REFRESH_TOKEN from client_secrets.json."""
    from google_auth_oauthlib.flow import InstalledAppFlow

    flow = InstalledAppFlow.from_client_secrets_file(
        client_secrets_file,
        scopes=["https://www.googleapis.com/auth/youtube.upload"],
    )
    creds = flow.run_local_server(port=8080, access_type="offline", prompt="consent")
    print("\n=== COPY THESE 3 VALUES INTO YOUR GITHUB REPOSITORY SECRETS ===")
    print(f"YOUTUBE_CLIENT_ID={creds.client_id}")
    print(f"YOUTUBE_CLIENT_SECRET={creds.client_secret}")
    print(f"YOUTUBE_REFRESH_TOKEN={creds.refresh_token}")


# ---------------------------------------------------------------------------
# CLI Entrypoint
# ---------------------------------------------------------------------------

def main() -> None:
    parser = argparse.ArgumentParser(description="Daily Cricket Shorts Pipeline for @CricketingBeastHK")
    parser.add_argument("--dry-run", action="store_true", help="Generate video MP4 locally without uploading to YouTube")
    parser.add_argument("--privacy", default=os.environ.get("YOUTUBE_PRIVACY", "public"), choices=["public", "unlisted", "private"])
    parser.add_argument("--get-refresh-token", metavar="CLIENT_SECRETS_JSON", help="Run one-time OAuth flow to get YOUTUBE_REFRESH_TOKEN")
    args = parser.parse_args()

    if args.get_refresh_token:
        run_oauth_refresh_token_helper(args.get_refresh_token)
        return

    published_topics = load_published_history()
    print(f"[1/3] Generating high-retention Cricket Short script for {CHANNEL_HANDLE} ({ len(published_topics) } past topics excluded)...")
    plan = generate_cricket_short_plan(published_topics)
    print(f"      Selected Topic: {plan['topic_id']} -> {plan['title']}")

    output_mp4 = OUTPUT_DIR / f"{plan['topic_id']}.mp4"
    print(f"[2/3] Synthesizing voiceover & rendering 1080x1920 9:16 vertical Short...")
    assemble_short_video(plan, output_mp4)
    print(f"      Rendered MP4: {output_mp4} ({output_mp4.stat().st_size / 1024:.1f} KB)")

    if args.dry_run:
        print("[3/3] --dry-run enabled: Skipping YouTube API upload.")
        return

    print(f"[3/3] Uploading Short to YouTube channel {CHANNEL_HANDLE} ({CHANNEL_ID})...")
    video_id = upload_to_youtube(output_mp4, plan, privacy_status=args.privacy)
    save_published_history(plan["topic_id"], plan["title"], video_id)


if __name__ == "__main__":
    main()
      privacy_status:
        description: 'YouTube video privacy status'
        required: false
        default: 'public'
permissions:
  contents: write
jobs:
  generate-and-upload-short:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: pip install google-genai edge-tts Pillow google-api-python-client google-auth-oauthlib google-auth-httplib2
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY: ${{ inputs.privacy_status || 'public' }}
        run: python daily_cricket_shorts_pipeline.py
      - run: |
          if [ -f published_history.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add published_history.json
            git diff --staged --quiet || git commit -m "chore: log daily Short [skip ci]"
            git push
          fi
