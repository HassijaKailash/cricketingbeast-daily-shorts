CHANNEL_HANDLE = "@CricketingBeastHK"
HISTORY_FILE = Path("published_history.json")
OUTPUT_DIR = Path("build_output")
VIDEO_WIDTH = 1080
VIDEO_HEIGHT = 1920
FPS = 30
DEFAULT_VOICE = os.environ.get("TTS_VOICE", "en-IN-PrabhatNeural")


# ---------------------------------------------------------------------------
# 1. High-Retention Cricket Script & Metadata Generator (Gemini API)
# ---------------------------------------------------------------------------

HIGH_RETENTION_SYSTEM_PROMPT = """
You are the lead content strategist and scriptwriter for the YouTube Shorts channel
CricketingBeast (@CricketingBeastHK). Your audience consists of passionate cricket
fans (India, UK, Australia, Pakistan, South Africa, and global) who love jaw-dropping
cricket statistics, untold debut stories (like #SachinDebutMatch), unbreakable IPL and
ICC World Cup records, last-over thrillers, and tactical breakdowns.

Design a single 40-to-50-second YouTube Short engineered for >100% Audience Viewed vs.
Swiped Away (VVSA) and >95% Average Percentage Viewed (APV) using this 5-beat retention
architecture:
1. Beat 1 (0-4s) — THE PATTERN-INTERRUPT HOOK: Open with a shocking statistical paradox,
   myth-busting claim, or high-stakes question in under 12 words. Never say "Hello guys"
   or "Welcome back".
2. Beat 2 (4-13s) — THE STAKES & CONTEXT: Establish the match, year, player, and why
   everyone thought the outcome was impossible.
3. Beat 3 (13-26s) — RAPID ESCALATION (STAT BREAKDOWN): Deliver 2-3 rapid-fire numbers,
   ball-by-ball shifts, or record comparisons that build tension.
4. Beat 4 (26-38s) — THE CLIMAX & UNBELIEVABLE REVEAL: Reveal the final record, twist,
   or historic milestone.
5. Beat 5 (38-45s) — THE DEBATE & SEAMLESS LOOP OUTRO: Ask a polarizing 1-sentence
   cricket fan question to drive comments, and end with a sentence fragment that
   grammatically flows straight back into Beat 1's opening words for a seamless loop.

Return STRICT JSON matching this exact schema:
{
  "topic_id": "unique-kebab-case-slug",
  "title": "Catchy Title under 65 chars with 1-2 power words #Shorts #Cricket",
  "description": "SEO description with story summary, comment question, and hashtags",
  "tags": ["cricket", "cricketshorts", "cricketingbeast", "ipl", "viratkohli", "sachintendulkar"],
  "category_id": "17",
  "beats": [
    {
      "beat_number": 1,
      "phase_label": "HOOK",
      "headline_stat": "SHORT 2-4 WORD BIG STAT OR HEADLINE",
      "sub_stat": "Supporting match/year/player badge text",
      "narration": "Exact spoken voiceover line for this beat (energetic, punchy).",
      "accent_hex": "#FF9933"
    }
  ]
}
Ensure exactly 5 beats in the `beats` array.
"""


def load_published_history() -> List[str]:
    if HISTORY_FILE.exists():
        try:
            data = json.loads(HISTORY_FILE.read_text(encoding="utf-8"))
            return data.get("published_topics", [])
        except Exception:
            return []
    return []


def save_published_history(topic_id: str, title: str, video_id: str) -> None:
    history = {"published_topics": [], "runs": []}
    if HISTORY_FILE.exists():
        try:
            history = json.loads(HISTORY_FILE.read_text(encoding="utf-8"))
        except Exception:
            pass
    if topic_id not in history.setdefault("published_topics", []):
        history["published_topics"].append(topic_id)
    history.setdefault("runs", []).append(
        {
            "date_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "topic_id": topic_id,
            "title": title,
            "youtube_video_id": video_id,
        }
    )
    HISTORY_FILE.write_text(json.dumps(history, indent=2), encoding="utf-8")


def generate_cricket_short_plan(exclude_topics: List[str]) -> Dict[str, Any]:
    """Generates a structured 5-beat cricket Short script via Google AI Studio (Gemini)."""
    api_key = os.environ.get("GEMINI_API_KEY")
    if not api_key:
        print("[INFO] GEMINI_API_KEY not set; using built-in fallback high-retention script.")
        return get_fallback_script()

    from google import genai
    from google.genai import types

    client = genai.Client(api_key=api_key)
    exclusion_clause = (
        f"Do NOT repeat any of these previously covered topic IDs: {', '.join(exclude_topics[-50:])}."
        if exclude_topics
        else "Pick an iconic, high-engagement cricket record or untold match story."
    )
    user_prompt = (
        f"Create today's high-retention cricket YouTube Short for {CHANNEL_HANDLE}.\n"
        f"Date: {datetime.date.today().isoformat()}\n"
        f"{exclusion_clause}\n"
        "Output valid JSON only."
    )

    response = client.models.generate_content(
        model="gemini-2.5-flash",
        contents=user_prompt,
        config=types.GenerateContentConfig(
            system_instruction=HIGH_RETENTION_SYSTEM_PROMPT,
            response_mime_type="application/json",
            temperature=0.8,
        ),
    )
    return json.loads(response.text)


